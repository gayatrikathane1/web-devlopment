<html>

<head>
    <title> lets create a form </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="post">
        <div>
            
            <lebal for="username">Enter your usename</lebal>
            <input type="text" id="usename" name="username" placeholder="Enter your username">
        </div>
        <div>
            <lebal for="gender">male</lebal>
            <input type="radio" id="male" name="gender" value="male">
        
            <lebal for="gender">female</lebal>
            <input type="radio" id="female" name="gender" value="female">
        </div>

        <div>
            <lebal for="age">enter your age</lebal>
            <input type="text" id="age" name="age" placeholder="enter your age">
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <lebal for="subscribe">subscribe our channle</lebal>
        </div>

    </form>
</body>


</html>
